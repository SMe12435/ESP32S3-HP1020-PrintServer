<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireless Print Server</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">

    <!-- Login screen -->
    <div id="login-screen" class="screen hidden">
      <div class="card login-card">
        <h1>Print Server</h1>
        <p class="subtitle">Enter password to continue</p>
        <form id="login-form">
          <input type="password" id="login-pw" placeholder="Password" autofocus>
          <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <p id="login-error" class="error hidden">Wrong password</p>
      </div>
    </div>

    <!-- Main screen -->
    <div id="main-screen" class="screen hidden">
      <header>
        <h1>Wireless Print Server</h1>
        <div id="printer-badge" class="badge offline">Printer Offline</div>
      </header>

      <main>
        <!-- Upload area -->
        <section class="card">
          <h2>Print Document</h2>
          <div id="drop-zone" class="drop-zone">
            <p>Drag &amp; drop a file here, or <label for="file-input" class="link">browse</label></p>
            <p class="hint">PDF, PNG, JPG, TIFF, TXT — up to 50 MB</p>
            <input type="file" id="file-input" accept=".pdf,.png,.jpg,.jpeg,.tiff,.tif,.bmp,.txt,.text,.log" hidden>
          </div>
          <div id="file-info" class="file-info hidden">
            <span id="file-name"></span>
            <button id="file-clear" class="btn-icon" title="Remove">&times;</button>
          </div>

          <!-- Print settings -->
          <div id="settings" class="settings hidden">
            <div class="setting-row">
              <label for="copies">Copies</label>
              <input type="number" id="copies" value="1" min="1" max="99">
            </div>
            <div class="setting-row">
              <label for="page-range">Pages</label>
              <input type="text" id="page-range" value="all" placeholder="all, or 1-3, 5">
            </div>
            <div class="setting-row">
              <label for="paper">Paper</label>
              <select id="paper">
                <option value="letter" selected>Letter</option>
                <option value="a4">A4</option>
              </select>
            </div>
            <div class="setting-row">
              <label for="orientation">Orientation</label>
              <select id="orientation">
                <option value="portrait" selected>Portrait</option>
                <option value="landscape">Landscape</option>
              </select>
            </div>
            <div class="setting-row">
              <label for="dpi">Quality</label>
              <select id="dpi">
                <option value="600" selected>Normal (600 DPI)</option>
                <option value="300">Draft (300 DPI)</option>
              </select>
            </div>
            <button id="print-btn" class="btn btn-primary btn-print">Print</button>
          </div>
        </section>

        <!-- Job status -->
        <section class="card">
          <h2>Print Queue</h2>
          <div id="jobs-list" class="jobs-list">
            <p class="empty-state">No print jobs yet</p>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
